# Optional Docker PostgreSQL: `make db-docker` fills in DATABASE_URL's settings (no credential here).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?start it with make db-docker (it takes the password of DATABASE_URL)}
      POSTGRES_DB: ${POSTGRES_DB:-musicroom}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
