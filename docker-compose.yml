# Optional: PostgreSQL in Docker (alternative to `make db`). Credentials come from the
# environment / a root .env file (ignored by git), with development defaults.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musicroom}
      POSTGRES_DB: ${POSTGRES_DB:-musicroom}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
